<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MediaPipe Pose — Explicit Model Loader</title>
  <style>
    :root { --bg:#071029; --card:rgba(255,255,255,0.03); --muted:#9fb0bd; --good:#7ef2c7; --bad:#ff9a9a }
    body { margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,Arial; background:linear-gradient(180deg,#04101a,#071629); color:#e6f7f5; padding:18px; }
    .wrap { max-width:1100px; margin:0 auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px }
    h1 { margin:0; font-size:1.25rem }
    .grid { display:grid; grid-template-columns: 1fr 360px; gap:12px; }
    .card { background:var(--card); padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.03); box-shadow:0 8px 30px rgba(2,8,20,0.6) }
    #videoWrap { position:relative; border-radius:10px; overflow:hidden; }
    video { display:block; width:100%; height:auto; background:#000; transform:scaleX(-1) }
    canvas.overlay { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; transform:scaleX(-1) }
    select,input,button { padding:8px 10px; border-radius:8px; border:0; background:rgba(255,255,255,0.02); color:inherit }
    .row { display:flex; gap:8px; align-items:center; margin-top:8px }
    pre { background:rgba(0,0,0,0.24); padding:10px; border-radius:8px; max-height:320px; overflow:auto }
    .status { font-size:0.95rem; color:var(--muted) }
    .ok { color:var(--good) } .err { color:var(--bad) }
    .small { font-size:0.9rem; color:var(--muted) }
    @media(max-width:980px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>MediaPipe Pose — Explicit Model Loader</h1>
        <div class="small">This page explicitly loads MediaPipe assets, initializes the model, and reports status so you can confirm the model actually loaded.</div>
      </div>
      <div class="small" id="pageProtocol"></div>
    </header>

    <div class="grid">
      <div>
        <div class="card" id="videoCard">
          <div id="videoWrap">
            <video id="input_video" autoplay playsinline muted></video>
            <canvas id="output_canvas" class="overlay"></canvas>
          </div>

          <div class="row" style="justify-content:space-between; margin-top:10px">
            <div class="status" id="cameraInfo">Camera: —</div>
            <div class="status">Model: <span id="modelStatus" class="err">not loaded</span></div>
          </div>
        </div>

        <div class="card" style="margin-top:12px">
          <div><strong>Last compact frame</strong></div>
          <pre id="jsonOut">No frames yet.</pre>
        </div>
      </div>

      <div>
        <div class="card">
          <div style="margin-bottom:8px"><strong>Controls</strong></div>
          <div style="margin-bottom:8px">
            <label class="small">Camera</label>
            <select id="cameraSelect"></select>
          </div>

          <div class="row">
            <select id="resSelect">
              <option value="1280x720">1280 × 720</option>
              <option value="960x540">960 × 540</option>
              <option value="640x480">640 × 480</option>
              <option value="320x240">320 × 240</option>
            </select>
            <button id="startBtn">Start</button>
            <button id="stopBtn">Stop</button>
          </div>

          <hr style="margin:10px 0;border:none;height:1px;background:rgba(255,255,255,0.03)">

          <div style="margin-bottom:8px">
            <label class="small">Model options</label>
            <div class="row">
              <label class="small">complexity</label>
              <select id="modelComplexity">
                <option value="0">0 (fast)</option>
                <option value="1" selected>1 (balanced)</option>
                <option value="2">2 (accurate)</option>
              </select>
            </div>

            <div class="row" style="margin-top:6px">
              <label class="small">minDetectionConfidence</label>
              <input id="minDetect" type="range" min="0" max="1" step="0.05" value="0.5" />
            </div>
            <div class="row" style="margin-top:6px">
              <label class="small">minTrackingConfidence</label>
              <input id="minTrack" type="range" min="0" max="1" step="0.05" value="0.5" />
            </div>
          </div>

          <div class="row" style="margin-top:10px">
            <button id="loadModelBtn">Load Model (explicit)</button>
            <button id="resetBtn">Reset Model</button>
          </div>
        </div>

        <div class="card" style="margin-top:12px">
          <div><strong>Diagnostics log</strong></div>
          <pre id="log">Ready.</pre>
        </div>
      </div>
    </div>
  </div>

  <script>
  /* Explicit loader that waits for the scripts and (if available) calls pose.initialize().
     This addresses the "model not loading" situation by:
     - dynamically loading pose.js and drawing_utils.js in sequence
     - waiting for globals (window.Pose or window.mpPose.Pose) and drawConnectors
     - creating the Pose instance using locateFile pointing at the CDN package
     - awaiting pose.initialize() when present (MediaPipe optionally exposes it)
     - robust logging shown on page and console
  */

  const POSE_JS = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js';
  const DRAW_JS = 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.4/drawing_utils.js';
  const CDN_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/';

  // UI refs
  const pageProtocol = document.getElementById('pageProtocol');
  const cameraSelect = document.getElementById('cameraSelect');
  const resSelect = document.getElementById('resSelect');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const loadModelBtn = document.getElementById('loadModelBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modelStatusEl = document.getElementById('modelStatus');
  const logEl = document.getElementById('log');
  const cameraInfo = document.getElementById('cameraInfo');
  const jsonOut = document.getElementById('jsonOut');

  const videoEl = document.getElementById('input_video');
  const canvasEl = document.getElementById('output_canvas');
  const ctx = canvasEl.getContext('2d');

  pageProtocol.innerText = location.protocol;

  // state
  let stream = null;
  let running = false;
  let pose = null;
  let modelLoaded = false;
  let sendCount = 0;
  let lastFrameCompact = null;
  let rvfcActive = false;

  // logging
  function log(msg){
    const t = new Date().toLocaleTimeString();
    logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
    console.log('[MPDBG] ' + msg);
  }

  // safe dynamic script loader (returns when globalCheck returns truthy or times out)
  function loadScript(src, globalCheckFn, timeout = 8000) {
    return new Promise((resolve, reject) => {
      // already present?
      try {
        const ok = globalCheckFn && globalCheckFn();
        if (ok) { resolve(ok); return; }
      } catch(e){ /* continue to load */ }

      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      let settled = false;
      const timer = setTimeout(() => {
        if (settled) return;
        settled = true;
        reject(new Error('Timeout loading ' + src));
      }, timeout);

      s.onload = () => {
        try {
          const ok = globalCheckFn && globalCheckFn();
          clearTimeout(timer);
          settled = true;
          if (ok) resolve(ok);
          else resolve(true); // script loaded but check didn't detect specific global (caller will validate)
        } catch (e) {
          clearTimeout(timer);
          settled = true;
          reject(e);
        }
      };
      s.onerror = (e) => {
        clearTimeout(timer);
        if (settled) return;
        settled = true;
        reject(new Error('Failed to load ' + src));
      };
      document.head.appendChild(s);
    });
  }

  // explicit model loader
  async function ensureModelLoaded() {
    if (modelLoaded) {
      log('Model already loaded.');
      return true;
    }
    modelStatusEl.textContent = 'loading...';
    modelStatusEl.className = '';

    // load drawing utils first (optional, but ensures drawConnectors present)
    try {
      log('Loading drawing_utils.js …');
      await loadScript(DRAW_JS, () => typeof window.drawConnectors === 'function', 6000);
      log('drawing_utils loaded.');
    } catch (e) {
      log('drawing_utils load failed: ' + e.message + ' — continuing (draw may be missing).');
    }

    // load pose.js and wait for Pose constructor
    try {
      log('Loading pose.js …');
      await loadScript(POSE_JS, () => (typeof window.Pose === 'function') || (window.mpPose && window.mpPose.Pose), 10000);
      log('pose.js loaded.');
    } catch (e) {
      log('pose.js load failed: ' + e.message);
      modelStatusEl.textContent = 'load failed';
      modelStatusEl.className = 'err';
      return false;
    }

    // create Pose instance with locateFile pointing to the CDN base so wasm assets are fetched from same path
    try {
      log('Creating Pose instance …');
      if ((typeof window.Pose === 'function')) {
        pose = new Pose({ locateFile: (file) => CDN_BASE + file });
      } else if (window.mpPose && window.mpPose.Pose) {
        pose = new mpPose.Pose({ locateFile: (file) => CDN_BASE + file });
      } else {
        throw new Error('Pose constructor not found after loading script.');
      }

      // set options based on UI
      pose.setOptions({
        modelComplexity: Number(document.getElementById('modelComplexity')?.value || 1),
        smoothLandmarks: true,
        minDetectionConfidence: Number(document.getElementById('minDetect')?.value || 0.5),
        minTrackingConfidence: Number(document.getElementById('minTrack')?.value || 0.5)
      });
      pose.onResults(onResults);

      // some builds expose initialize/initializeAsync — call if present to force asset download/initialization
      if (typeof pose.initialize === 'function') {
        log('Calling pose.initialize() …');
        try {
          // initialize might be sync or async
          const r = pose.initialize();
          if (r && typeof r.then === 'function') {
            await r;
            log('pose.initialize() resolved.');
          } else {
            log('pose.initialize() completed (sync).');
          }
        } catch (ie) {
          log('pose.initialize() threw: ' + (ie && ie.message ? ie.message : ie));
        }
      } else {
        log('No pose.initialize() API present; assets will be loaded on first pose.send');
      }

      modelLoaded = true;
      modelStatusEl.textContent = 'loaded';
      modelStatusEl.className = 'ok';
      log('Model created and ready.');
      return true;
    } catch (e) {
      log('Failed to create Pose instance: ' + (e && e.message ? e.message : e));
      modelStatusEl.textContent = 'create failed';
      modelStatusEl.className = 'err';
      return false;
    }
  }

  // compact landmarks builder
  const UPPER_INDICES = {
    "nose": 0,
    "left_shoulder": 11,
    "right_shoulder": 12,
    "left_elbow": 13,
    "right_elbow": 14,
    "left_wrist": 15,
    "right_wrist": 16,
    "left_hip": 23,
    "right_hip": 24
  };
  function buildLandmarkObjects(poseLandmarks) {
    if (!poseLandmarks) return [];
    const out = [];
    for (const [name, idx] of Object.entries(UPPER_INDICES)) {
      const lm = poseLandmarks[idx];
      if (!lm) continue;
      out.push({
        name, index: idx,
        x: Number(lm.x.toFixed(6)),
        y: Number(lm.y.toFixed(6)),
        z: Number(lm.z.toFixed(6)),
        visibility: lm.visibility !== undefined ? Number(lm.visibility.toFixed(3)) : 1.0
      });
    }
    return out;
  }

  // onResults drawing + JSON preview
  function onResults(results) {
    try {
      if (!results) return;
      // ensure canvas matches
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
      ctx.save();
      ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
      ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

      if (results.poseLandmarks && results.poseLandmarks.length) {
        if (typeof window.drawConnectors === 'function') {
          drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {color:'#39ffcc', lineWidth:2});
          drawLandmarks(ctx, results.poseLandmarks, {color:'#ff6bcb', radius:3});
        }
        const compact = buildLandmarkObjects(results.poseLandmarks);
        lastFrameCompact = { timestamp: Date.now(), landmarks: compact };
        jsonOut.textContent = JSON.stringify(lastFrameCompact, null, 2);
      } else {
        // no landmarks detected this frame
      }

      ctx.restore();
    } catch (e) {
      log('onResults exception: ' + (e && e.message ? e.message : e));
    }
  }

  // enumerate cameras
  async function enumerateCameras() {
    try {
      // ask for one-shot permission to get labels
      try {
        const p = await navigator.mediaDevices.getUserMedia({ video:true });
        p.getTracks().forEach(t => t.stop());
      } catch (e) { /* permission may be denied; continue */ }

      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      cameraSelect.innerHTML = '';
      cams.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = c.deviceId;
        opt.textContent = c.label || `Camera ${i+1}`;
        cameraSelect.appendChild(opt);
      });
      if (cams.length === 0) cameraSelect.innerHTML = '<option value="">No camera</option>';
      log(`Enumerated cameras: ${cams.length}`);
    } catch (e) {
      log('enumerateCameras error: ' + e);
    }
  }

  // start camera and pump frames to pose (requestVideoFrameCallback preferred)
  async function startCamera() {
    // ensure model is loaded first (explicit)
    const ok = await ensureModelLoaded();
    if (!ok) {
      log('Model not available — will still try camera but pose will fail until model loads.');
    }

    // start camera
    try {
      const deviceId = cameraSelect.value || undefined;
      const [w,h] = (resSelect.value || '1280x720').split('x').map(Number);
      const constraints = { video: { width: { ideal: w }, height: { ideal: h }, deviceId: deviceId ? { exact: deviceId } : undefined }, audio: false };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      videoEl.srcObject = stream;
      await videoEl.play();
      cameraInfo.textContent = cameraSelect.selectedOptions[0]?.text || 'Camera';
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
      log(`Camera started ${videoEl.videoWidth}x${videoEl.videoHeight}`);
    } catch (e) {
      log('getUserMedia failed: ' + (e && e.message ? e.message : e));
      return;
    }

    running = true;
    // pump frames
    if (typeof videoEl.requestVideoFrameCallback === 'function') {
      rvfcActive = true;
      const cb = (now, metadata) => {
        if (!running) return;
        try {
          if (pose) {
            pose.send({ image: videoEl });
            sendCount++;
          } else {
            // attempt lazy create if not created (fallback)
            ensureModelLoaded();
          }
        } catch (e) {
          log('pose.send error: ' + (e && e.message ? e.message : e));
        }
        videoEl.requestVideoFrameCallback(cb);
      };
      videoEl.requestVideoFrameCallback(cb);
    } else {
      // fallback
      const id = setInterval(() => {
        if (!running) { clearInterval(id); return; }
        try {
          if (pose) pose.send({ image: videoEl });
        } catch (e) { log('pose.send error (fallback): ' + e); }
      }, 1000/30);
    }
  }

  function stopCamera() {
    running = false;
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      videoEl.srcObject = null;
    }
    cameraInfo.textContent = 'Stopped';
    log('Camera stopped.');
  }

  // UI events
  startBtn.addEventListener('click', async () => {
    await startCamera();
  });
  stopBtn.addEventListener('click', () => stopCamera());
  loadModelBtn.addEventListener('click', async () => {
    const ok = await ensureModelLoaded();
    if (ok) log('Model explicit load completed.');
  });
  resetBtn.addEventListener('click', () => {
    modelLoaded = false;
    modelStatusEl.textContent = 'not loaded';
    modelStatusEl.className = 'err';
    try { pose && pose.close && pose.close(); } catch(e) {}
    pose = null;
    log('Model reset. You can press "Load Model (explicit)" to reload.');
  });

  // initialize
  (async () => {
    log('Page loaded — use "Load Model (explicit)" then "Start".');
    modelStatusEl.textContent = 'not loaded';
    modelStatusEl.className = 'err';
    await enumerateCameras();
    if (cameraSelect.options.length > 0) cameraSelect.selectedIndex = 0;
  })();

  // expose debug handles for console
  window.__mpdbg = { ensureModelLoaded, startCamera, stopCamera, pose };
  </script>
</body>
</html>
