<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PrimalTrace – Sandbox Debug</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: monospace;
  }

  video, canvas {
    position: absolute;
    top: 0;
    left: 0;
    transform: scaleX(-1);
  }

  #debug {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.7);
    color: lime;
    padding: 10px;
    font-size: 12px;
    max-width: 340px;
    z-index: 10;
  }

  #debug input {
    width: 100%;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="debug">
  <div><b>PrimalTrace Sandbox</b></div>
  <div id="fps">FPS: --</div>

  <label>Video Scale</label>
  <input type="range" min="0.5" max="2" step="0.01" value="1" id="videoScale">

  <label>Skeleton Scale</label>
  <input type="range" min="0.5" max="2" step="0.01" value="1.2" id="skeletonScale">

  <label>
    <input type="checkbox" id="labels" checked>
    Show Bone Labels
  </label>

  <pre id="boneData"></pre>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const fpsEl = document.getElementById("fps");
const boneDataEl = document.getElementById("boneData");
const videoScaleEl = document.getElementById("videoScale");
const skeletonScaleEl = document.getElementById("skeletonScale");
const labelsEl = document.getElementById("labels");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// FPS tracking
let lastTime = performance.now();
let frames = 0;

function updateFPS() {
  frames++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fpsEl.textContent = `FPS: ${frames}`;
    frames = 0;
    lastTime = now;
  }
}

// Drawing helpers
function drawDot(x, y, r = 5) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawLine(a, b) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

function rotation(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x);
}

// MediaPipe
const pose = new Pose({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});

pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true
});

pose.onResults(results => {
  updateFPS();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;

  const lm = results.poseLandmarks;

  const joints = {
    head: lm[0],
    chest: lm[12],
    leftShoulder: lm[11],
    rightShoulder: lm[12],
    leftElbow: lm[13],
    rightElbow: lm[14],
    leftWrist: lm[15],
    rightWrist: lm[16]
  };

  const rect = video.getBoundingClientRect();
  const skScale = parseFloat(skeletonScaleEl.value);

  const mapped = {};
  for (let k in joints) {
    mapped[k] = {
      x: rect.left + joints[k].x * rect.width * skScale,
      y: rect.top + joints[k].y * rect.height * skScale,
      z: joints[k].z.toFixed(3)
    };
  }

  ctx.strokeStyle = "lime";
  ctx.fillStyle = "red";
  ctx.lineWidth = 2;

  drawLine(mapped.leftShoulder, mapped.rightShoulder);
  drawLine(mapped.leftShoulder, mapped.leftElbow);
  drawLine(mapped.leftElbow, mapped.leftWrist);
  drawLine(mapped.rightShoulder, mapped.rightElbow);
  drawLine(mapped.rightElbow, mapped.rightWrist);

  Object.entries(mapped).forEach(([name, p]) => {
    drawDot(p.x, p.y);
    if (labelsEl.checked) {
      ctx.fillText(name, p.x + 6, p.y - 6);
    }
  });

  // Debug output
  const debugOut = {};
  for (let k in mapped) {
    debugOut[k] = {
      x: mapped[k].x.toFixed(1),
      y: mapped[k].y.toFixed(1),
      z: mapped[k].z
    };
  }

  debugOut.rotations = {
    leftUpper: rotation(mapped.leftShoulder, mapped.leftElbow).toFixed(2),
    leftLower: rotation(mapped.leftElbow, mapped.leftWrist).toFixed(2),
    rightUpper: rotation(mapped.rightShoulder, mapped.rightElbow).toFixed(2),
    rightLower: rotation(mapped.rightElbow, mapped.rightWrist).toFixed(2)
  };

  boneDataEl.textContent = JSON.stringify(debugOut, null, 2);
});

// Camera
const camera = new Camera(video, {
  onFrame: async () => await pose.send({ image: video }),
  width: 1280,
  height: 720
});
camera.start();

// Video scaling
videoScaleEl.addEventListener("input", () => {
  video.style.transform = `scaleX(-1) scale(${videoScaleEl.value})`;
});

// Resize handling
window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
