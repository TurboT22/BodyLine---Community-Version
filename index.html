<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sandbox Upper-Body Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
  color: #0f0;
}
#video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  transform: scaleX(-1);
  display: none;
}
#overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#debug {
  position: fixed;
  top: 8px;
  left: 8px;
  background: rgba(0,0,0,0.7);
  border: 1px solid #0f0;
  padding: 6px;
  font-size: 12px;
  white-space: pre;
  z-index: 10;
}
#waiting {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: black;
  color: white;
  font-size: 18px;
  z-index: 100;
}
</style>
</head>

<body>

<div id="waiting">Waiting for camera…</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div id="debug">Loading…</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const debug = document.getElementById("debug");
const waiting = document.getElementById("waiting");

let lastTime = performance.now();
let fps = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const pose = new Pose({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});
pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
pose.onResults(onResults);

const cam = new Camera(video, {
  onFrame: async () => { await pose.send({ image: video }); },
  width: 720,
  height: 1280
});

const CONNECTIONS = [
  [11,12],          // shoulders
  [11,13],[13,15],  // left arm
  [12,14],[14,16],  // right arm
  [11,23],[12,24]   // torso to hips
];

function onResults(results) {
  waiting.style.display = "none";
  video.style.display = "block";

  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (!results.poseLandmarks) return;

  const lm = results.poseLandmarks;

  // Draw bones
  ctx.strokeStyle = "#00ff00";
  ctx.lineWidth = 2;
  CONNECTIONS.forEach(([a,b]) => {
    const p1 = { x: lm[a].x*canvas.width, y: lm[a].y*canvas.height };
    const p2 = { x: lm[b].x*canvas.width, y: lm[b].y*canvas.height };
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  });

  // Draw joints
  ctx.fillStyle = "#ff0000";
  [11,12,13,14,15,16,23,24].forEach(i => {
    const p = { x: lm[i].x*canvas.width, y: lm[i].y*canvas.height };
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
    ctx.fill();
  });

  // Simplified head
  const head = { x: lm[0].x*canvas.width, y: lm[0].y*canvas.height };
  ctx.fillStyle = "#00ffff";
  ctx.beginPath();
  ctx.arc(head.x, head.y, 6, 0, Math.PI*2);
  ctx.fill();

  // FPS
  const now = performance.now();
  fps = Math.round(1000/(now-lastTime));
  lastTime = now;

  debug.textContent = `FPS: ${fps}\nUpper-body only`;
}

cam.start();
</script>

</body>
</html>
