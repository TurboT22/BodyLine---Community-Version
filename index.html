<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PrimalTrace Prototype</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }
  video, canvas {
    position: absolute;
    top: 0;
    left: 0;
    transform: scaleX(-1); /* mirror for natural movement */
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Initial canvas size
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Optional skeleton scale (tweak if your rig is smaller/larger)
const skeletonScale = 1.2;

// Helpers
function drawDot(x, y, r = 6) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawLine(a, b) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

function getRotation(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x);
}

// MediaPipe setup
const pose = new Pose({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  enableSegmentation: false
});

pose.onResults(results => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "lime";
  ctx.fillStyle = "red";
  ctx.lineWidth = 3;

  if (!results.poseLandmarks) return;

  const lm = results.poseLandmarks;

  // Upper-body joints
  const joints = {
    head: lm[0],
    chest: lm[12],
    leftShoulder: lm[11],
    rightShoulder: lm[12],
    leftElbow: lm[13],
    rightElbow: lm[14],
    leftWrist: lm[15],
    rightWrist: lm[16]
  };

  // Scale & map to **displayed video**
  const rect = video.getBoundingClientRect();
  for (let k in joints) {
    joints[k] = {
      x: rect.left + (joints[k].x * rect.width - rect.left) * skeletonScale,
      y: rect.top + (joints[k].y * rect.height - rect.top) * skeletonScale
    };
  }

  // Draw skeleton lines
  drawLine(joints.leftShoulder, joints.rightShoulder);
  drawLine(joints.leftShoulder, joints.leftElbow);
  drawLine(joints.leftElbow, joints.leftWrist);
  drawLine(joints.rightShoulder, joints.rightElbow);
  drawLine(joints.rightElbow, joints.rightWrist);

  // Draw dots
  Object.values(joints).forEach(j => drawDot(j.x, j.y));

  // Output rotation data for Unity
  const data = {
    leftUpperArmRot: getRotation(joints.leftShoulder, joints.leftElbow),
    leftLowerArmRot: getRotation(joints.leftElbow, joints.leftWrist),
    rightUpperArmRot: getRotation(joints.rightShoulder, joints.rightElbow),
    rightLowerArmRot: getRotation(joints.rightElbow, joints.rightWrist),
    torsoRot: getRotation(joints.leftShoulder, joints.rightShoulder)
  };

  // Example: log to console (later replace with WebSocket / fetch)
  console.log(data);
});

// Camera setup
const camera = new Camera(video, {
  onFrame: async () => await pose.send({ image: video }),
  width: 1280,
  height: 720
});
camera.start();

// Responsive canvas
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
