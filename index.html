<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sandbox Body Tracking Debug</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        font-family: monospace;
        color: #0f0;
    }

    #container {
        position: fixed;
        inset: 0;
    }

    #video {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: top left;
        display: none;
    }

    #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        background: rgba(0,0,0,0.7);
        padding: 8px;
        border: 1px solid #0f0;
        font-size: 12px;
        z-index: 999;
        white-space: pre;
    }

    #waiting {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
        background: black;
        z-index: 1000;
    }
</style>
</head>

<body>

<div id="waiting">Waiting for camera permission…</div>

<div id="container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
</div>

<div id="debug">Initializing…</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const debug = document.getElementById("debug");
const waiting = document.getElementById("waiting");

/* ======================
   DEBUG SETTINGS (AUTO)
====================== */
let debugMode = true;

// Video transform controls
let videoScale = 1.4;
let videoOffsetX = -200;
let videoOffsetY = 0;

// FPS
let lastTime = performance.now();
let fps = 0;

/* ======================
   CAMERA SETUP
====================== */
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
            video.play();
            video.style.display = "block";
            waiting.style.display = "none";
            resize();
            requestAnimationFrame(loop);
        };

    } catch (err) {
        waiting.innerText = "Camera blocked or unavailable";
        console.error(err);
    }
}

/* ======================
   RESIZE HANDLING
====================== */
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    video.style.transform =
        `translate(${videoOffsetX}px, ${videoOffsetY}px) scale(${videoScale})`;
}

window.addEventListener("resize", resize);

/* ======================
   MAIN LOOP
====================== */
function loop(now) {
    const delta = now - lastTime;
    fps = Math.round(1000 / delta);
    lastTime = now;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Example skeleton placeholder (replace with real data)
    drawDebugSkeleton();

    if (debugMode) {
        debug.textContent =
`FPS: ${fps}
Video Scale: ${videoScale.toFixed(2)}
Offset X: ${videoOffsetX}
Offset Y: ${videoOffsetY}
Canvas: ${canvas.width}x${canvas.height}
Video: ${video.videoWidth}x${video.videoHeight}`;
    }

    requestAnimationFrame(loop);
}

/* ======================
   DEBUG SKELETON (TEST)
====================== */
function drawDebugSkeleton() {
    ctx.strokeStyle = "#00ff00";
    ctx.lineWidth = 2;

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    ctx.beginPath();
    ctx.arc(cx, cy - 100, 10, 0, Math.PI * 2); // head
    ctx.moveTo(cx, cy - 90);
    ctx.lineTo(cx, cy + 50); // spine
    ctx.moveTo(cx - 50, cy);
    ctx.lineTo(cx + 50, cy); // arms
    ctx.moveTo(cx, cy + 50);
    ctx.lineTo(cx - 30, cy + 120); // leg
    ctx.moveTo(cx, cy + 50);
    ctx.lineTo(cx + 30, cy + 120); // leg
    ctx.stroke();
}

/* ======================
   KEYBOARD CONTROLS
====================== */
window.addEventListener("keydown", e => {
    switch (e.key) {
        case "+":
        case "=":
            videoScale += 0.05;
            break;
        case "-":
            videoScale -= 0.05;
            break;
        case "ArrowLeft":
            videoOffsetX -= 10;
            break;
        case "ArrowRight":
            videoOffsetX += 10;
            break;
        case "ArrowUp":
            videoOffsetY -= 10;
            break;
        case "ArrowDown":
            videoOffsetY += 10;
            break;
    }
    resize();
});

/* ======================
   START
====================== */
startCamera();
</script>

</body>
</html>
