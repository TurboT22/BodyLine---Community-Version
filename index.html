<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PrimalTrace – Sandbox Debug (Fixed)</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: monospace;
  }

  video {
    position: absolute;
    top: 0;
    left: 0;
    width: 320px;   /* FORCE size so it always exists */
    height: 240px;
    transform: scaleX(-1);
    z-index: 1;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    transform: scaleX(-1);
  }

  #debug {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.75);
    color: lime;
    padding: 10px;
    font-size: 12px;
    width: 340px;
    z-index: 10;
  }

  input { width: 100%; }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="debug">
  <b>PrimalTrace Sandbox</b><br>
  <span id="fps">FPS: --</span><br><br>

  Video Scale
  <input type="range" id="videoScale" min="0.5" max="2" step="0.01" value="1">

  Skeleton Scale
  <input type="range" id="skeletonScale" min="0.5" max="2" step="0.01" value="1.2">

  <pre id="boneData">Waiting for camera…</pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const fpsEl = document.getElementById("fps");
const boneDataEl = document.getElementById("boneData");
const videoScaleEl = document.getElementById("videoScale");
const skeletonScaleEl = document.getElementById("skeletonScale");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// FPS (independent of pose)
let last = performance.now();
let frames = 0;
function fpsTick() {
  frames++;
  const now = performance.now();
  if (now - last >= 1000) {
    fpsEl.textContent = "FPS: " + frames;
    frames = 0;
    last = now;
  }
  requestAnimationFrame(fpsTick);
}
fpsTick();

// Helpers
function line(a,b){
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
}
function dot(p){
  ctx.beginPath();
  ctx.arc(p.x,p.y,5,0,Math.PI*2);
  ctx.fill();
}

// Pose
const pose = new Pose({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});
pose.setOptions({ smoothLandmarks:true });

pose.onResults(res=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!res.poseLandmarks) return;

  const lm = res.poseLandmarks;
  const rect = video.getBoundingClientRect();
  const s = parseFloat(skeletonScaleEl.value);

  const j = {
    ls: lm[11], le: lm[13], lw: lm[15],
    rs: lm[12], re: lm[14], rw: lm[16]
  };

  const m = {};
  for(const k in j){
    m[k] = {
      x: rect.left + j[k].x * rect.width * s,
      y: rect.top  + j[k].y * rect.height * s,
      z: j[k].z.toFixed(3)
    };
  }

  ctx.strokeStyle="lime";
  ctx.fillStyle="red";
  line(m.ls,m.le); line(m.le,m.lw);
  line(m.rs,m.re); line(m.re,m.rw);
  Object.values(m).forEach(dot);

  boneDataEl.textContent = JSON.stringify(m,null,2);
});

// Start camera ONLY after metadata loads
video.onloadedmetadata = () => {
  const cam = new Camera(video,{
    onFrame: async()=> await pose.send({image:video}),
    width:1280,height:720
  });
  cam.start();
};

// Safe scaling (preserves mirror)
videoScaleEl.oninput = ()=>{
  video.style.transform = `scaleX(-1) scale(${videoScaleEl.value})`;
};

// Resize
window.onresize = ()=>{
  canvas.width = innerWidth;
  canvas.height = innerHeight;
};
</script>
</body>
</html>
