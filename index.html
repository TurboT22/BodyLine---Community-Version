<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sandbox Body Tracking Debug</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    font-family: monospace;
    color: #0f0;
}

#video {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    display: none;
}

#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

#debug {
    position: fixed;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.7);
    padding: 8px;
    border: 1px solid #0f0;
    font-size: 12px;
    white-space: pre;
    z-index: 10;
}

#waiting {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    background: black;
    z-index: 100;
}
</style>
</head>

<body>

<div id="waiting">Waiting for camera permission…</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div id="debug">Loading tracker…</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const debug = document.getElementById("debug");
const waiting = document.getElementById("waiting");

/* ======================
   VIDEO TRANSFORM
====================== */
let videoScale = 1.4;
let videoOffsetX = -200;
let videoOffsetY = 0;

/* ======================
   FPS
====================== */
let lastTime = performance.now();
let fps = 0;

/* ======================
   RESIZE
====================== */
function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    video.style.transform =
        `translate(${videoOffsetX}px, ${videoOffsetY}px) scale(${videoScale})`;
}
addEventListener("resize", resize);

/* ======================
   MEDIAPIPE POSE
====================== */
const pose = new Pose({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(onResults);

/* ======================
   CAMERA
====================== */
const cam = new Camera(video, {
    onFrame: async () => {
        await pose.send({ image: video });
    },
    width: 1280,
    height: 720
});

/* ======================
   RESULTS
====================== */
function onResults(results) {
    waiting.style.display = "none";
    video.style.display = "block";
    resize();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.poseLandmarks) {
        drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
            color: "#00ff00",
            lineWidth: 2
        });
        drawLandmarks(ctx, results.poseLandmarks, {
            color: "#ff0000",
            radius: 3
        });
    }

    const now = performance.now();
    fps = Math.round(1000 / (now - lastTime));
    lastTime = now;

    if (results.poseLandmarks) {
        const hip = results.poseLandmarks[23];
        debug.textContent =
`FPS: ${fps}
Video Scale: ${videoScale.toFixed(2)}
Offset X: ${videoOffsetX}
Offset Y: ${videoOffsetY}

HIP:
x: ${hip.x.toFixed(3)}
y: ${hip.y.toFixed(3)}
z: ${hip.z.toFixed(3)}`;
    }
}

/* ======================
   KEY CONTROLS
====================== */
addEventListener("keydown", e => {
    switch (e.key) {
        case "+":
        case "=": videoScale += 0.05; break;
        case "-": videoScale -= 0.05; break;
        case "ArrowLeft": videoOffsetX -= 10; break;
        case "ArrowRight": videoOffsetX += 10; break;
        case "ArrowUp": videoOffsetY -= 10; break;
        case "ArrowDown": videoOffsetY += 10; break;
    }
    resize();
});

/* ======================
   START
====================== */
cam.start();
</script>

</body>
</html>
